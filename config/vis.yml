# KEYWORD ARGUMENTs for the jupyter-notebook visualization.
name: 'stereo'
time_interval: 1
polynomial_order:
  - 4
choices: 
  # - 'all dates'
  - 'sun'
  # - 'all data'
  # - 'all data integration'
  - 'no duplicate'
  - 'no duplicate integration'
  - 'line of sight stereo'
  - 'pov stereo'
width: 640
height: 640

# CONFIG
compression_level: 9
verbose: 10
flush: true
