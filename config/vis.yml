# KEYWORD ARGUMENTs for the jupyter-notebook visualization.
time_interval: 1
polynomial_order:
  - 4
choices: 
  # - 'all dates'
  - 'sun'
  # - 'all data'
  # - 'all data integration'
  # - 'no duplicate'
  # - 'no duplicate integration'
  - 'line of sight sdo'
  # - 'line of sight stereo'
  - 'pov sdo'

# CONFIG
compression_level: 9
verbose: 0
flush: false
