# KEYWORD ARGUMENTs for the jupyter-notebook visualization.
time_interval: 1
polynomial_order:
  - 4
choices: 
  # - 'all dates'
  - 'sun'
  # - 'all data'
  # - 'all data integration'
  - 'no duplicate'
  - 'no duplicate integration'
  - 'line of sight sdo'
  - 'pov sdo'
width: 1080
height: 1080

# CONFIG
compression_level: 9
verbose: 10
flush: true
