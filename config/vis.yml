# KEYWORD ARGUMENTs for the jupyter-notebook visualization.
# DATA
time_interval: 6
polynomial_order:
  - 4
choices: 
  - 'all dates'
  - 'sun'
  # - 'all data'
  # - 'all data integration'
  # - 'no duplicate'
  - 'no duplicate integration'
  # - 'line of sight sdo'
  - 'pov stereo'

# VIS
offscreen: true
name: 'f_stereo_6h'
px: 720

# CONFIG
compression_level: 9
verbose: 10
flush: true
